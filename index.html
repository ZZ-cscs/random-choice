<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>今天做什么？</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">

  <div class="logo">
    ✨
  </div>

  <h1>
    今日灵感
  </h1>

  <p class="subtitle">
    不知道做什么？
    <br>
    让随机帮你发现生活的小惊喜
  </p>

</div>

   <div class="categories" id="categoryList">

</div>

<button
  class="all-btn"
  onclick="randomAll()">
  🎯 全部随机
</button>

    <details class="fold-box">

  <summary>
    ➕ 新增类别
  </summary>

  <div class="fold-content">

    <input
      id="newCategoryName"
      placeholder="输入类别名称，例如：运动">

    <input
      id="newCategoryIcon"
      placeholder="输入图标，例如：🏃"
      maxlength="4">

    <button onclick="addCategory()">
      ➕ 添加类别
    </button>

  </div>

</details> 

    </div>

    <div class="result-box">

        <div class="mode-box">

<h3>🎯 抽签模式</h3>

<label>
<input 
type="radio"
name="mode"
value="repeat"
checked
>
允许重复
</label>


<label>
<input 
type="radio"
name="mode"
value="once"
>
抽中过的不再出现
</label>


</div>

      <p id="categoryText">
  请先选择一个类别
</p>

<div class="result-card">

  <div class="card-brand">
    ✨ 今日灵感
  </div>

  <div id="resultIcon">
    ✨
  </div>

  <p id="resultTitle">
    等待选择
  </p>

  <h2 id="result">
    ？
  </h2>

  <p id="resultTip">
    选择一个类别开始吧
  </p>

  <div class="card-footer">
    让随机帮你做个小决定
  </div>

</div>

      <button
        id="drawButton"
        onclick="drawItem()"
        disabled
      >
        🎲 开始抽签
      </button>

<button
  id="shareButton"
  onclick="shareResult()"
  disabled
>
  📤 分享结果
</button>

 <details class="fold-box">

<summary>
📜 抽签记录
</summary>


<div class="fold-content">

<button onclick="clearHistory()">
🗑 清空记录
</button>


<ul id="historyList"></ul>


</div>

</details> 

<details class="fold-box">


<summary>
⚙️ 签库管理
</summary>


<div class="fold-content">


<h3>
添加签内容
</h3>


<input 
id="newItem"
placeholder="输入新的抽签内容">


<button onclick="addItem()">
➕ 添加
</button>


</div>

</details>

<details class="fold-box">


<summary>
📋 当前灵感库
</summary>


<div class="fold-content">


<ul id="itemList"></ul>


<button onclick="resetItems()">
🔄 恢复全部签
</button>


</div>


</details>

<!-- 关闭 result-box -->
</div>


<!-- 关闭 container -->
</div>

  <script src="script.js"></script>

</body>

</html>
